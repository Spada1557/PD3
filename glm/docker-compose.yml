version: '3.8'

services:
  enamelware-backend:
    build:
      context: ./enamelware-backend
      dockerfile: Dockerfile
    container_name: enamelware-backend-srv
    ports:
      - "8000:8000"
    volumes:
      - enamelware-data:/app/enamelware
    environment:
      - SECRET_KEY=change-this-secret-key-in-production
      - DATABASE_URL=sqlite:///./enamelware.db
    restart: unless-stopped

  enamelware-frontend:
    build:
      context: ./enamelware-frontend
      dockerfile: Dockerfile
    container_name: enamelware-frontend-srv
    ports:
      - "80:80"
    depends_on:
      - enamelware-backend
    restart: unless-stopped

volumes:
  enamelware-data: