version: "3.9"

services:
  emal-posuda-backend:
    container_name: emal-posuda-backend
    image: emal-posuda-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "18473:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - SECRET_KEY=super-secret-key-change-me
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    networks:
      - emal-posuda-net

  emal-posuda-frontend:
    container_name: emal-posuda-frontend
    image: emal-posuda-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "28491:80"
    depends_on:
      - emal-posuda-backend
    networks:
      - emal-posuda-net

networks:
  emal-posuda-net:
    name: emal-posuda-net

volumes:
  emal-posuda-data:
