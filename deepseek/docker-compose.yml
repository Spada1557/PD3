version: '3.8'

services:
  enamel-backend:
    container_name: enamel-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./backend/db:/app/db
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./db/warehouse.db
      - JWT_SECRET_KEY=enamelware-production-secret-key-2024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  enamel-frontend:
    container_name: enamel-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      enamel-backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: enamel-network
